services:
  whatsapp_go:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "20"
    build:
      context: .
      dockerfile: ./docker/golang.Dockerfile
    image: gedeadisurya/go-whatsapp-multi:latest
    container_name: kapitmas_whatsapp_go
    restart: "on-failure"
    ports:
      - "3003:3000"
    networks:
      - go_kapitmas
    env_file:
      - src/.env
    environment:
      - APP_PORT=3000
      - APP_DEBUG=true

    volumes:
      # Persist WhatsApp + chat DBs; entrypoint chowns for gowauser (uid 20001, gid 20000) on start.
      # - ./storages:/app/storages
      - ./statics:/app/statics
      - ./whatsapp_data:/app/storages

    command:
      - rest
      - --basic-auth=admin:admin
      - --port=3000
      - --debug=true
      - --os=Chrome
      - --account-validation=false
    # volumes:
    #   - ./whatsapp_data:/app/storages
networks:
  go_kapitmas:
    driver: bridge

volumes:
  storages:
  statics: